# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Root Directory: repo root (folder with package.json), not `src`.
# Start Command: `npm start` (recommended) or `node dist/server.js` after install.
#
# Monorepo: set service rootDir to this backend path from the repo root, e.g.
#   rootDir: QA_Hysomer/hysomer_Qa_testingTool_backend
# Or set that path as "Root Directory" in the Render service settings.
#
# Build: `npm install` is enough — postinstall compiles TypeScript when dist/ is missing.
# Output is mirrored to src/dist/ so `node dist/server.js` works when Root Directory is wrongly set to `src`.
#
# Prefer Root Directory = repo root (folder with package.json), Start = `npm start`.

services:
  - type: web
    runtime: node
    name: hysomer-qa-testing-backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://hysomer-qa-testing-tool-frontend.vercel.app
