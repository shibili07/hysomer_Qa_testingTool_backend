# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Root Directory (Dashboard / Blueprint): folder that contains package.json and tsconfig.json.
# Start Command: `npm start` or `node ./src/render-start.mjs` — never `node src/dist/server.js`.
#
# Monorepo: set service rootDir to this backend path from the repo root, e.g.
#   rootDir: QA_Hysomer/hysomer_Qa_testingTool_backend
# Or set that path as "Root Directory" in the Render service settings.
#
# NODE_ENV=production can skip devDependencies; --include=dev keeps `tsc` available for build.

services:
  - type: web
    runtime: node
    name: hysomer-qa-testing-backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    # Resolves dist/server.js from disk (never use node src/dist/server.js).
    startCommand: node ./src/render-start.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
