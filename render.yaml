# Render Blueprint: https://render.com/docs/blueprint-spec
#
# For a monorepo, point Render's Blueprint file path to this file, or set
# rootDir on the service to this folder from a repo-root render.yaml.

services:
  - type: web
    runtime: node
    name: hysomer-qa-testing-backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
